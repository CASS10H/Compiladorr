name: Universal Project Compiler
on:
  push:
    paths:
      - 'input/project.zip'
      - 'build.json'
      - 'scripts/**'
      - '.github/workflows/universal-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: universal-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Detect and build project
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install native build tools and Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build zip unzip
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate input
        run: python - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path('input/project.zip')
          if not p.is_file(): raise SystemExit('Envie o projeto em input/project.zip')
          with zipfile.ZipFile(p) as z:
            bad=z.testzip()
            if bad: raise SystemExit(f'ZIP corrompido: {bad}')
          print('ZIP válido')
          PY
      - name: Build project
        run: python -u scripts/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Universal-Build-Output
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
